name: GitHub Readme Stats Action

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Generate Top Languages Card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: 'username=snabady&layout=compact&theme=visual_studio_code'
          path: 'profile/top-langs.svg'
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate General Stats Card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: 'username=snabady&show_icons=true&theme=visual_studio_code&include_all_commits=true'
          path: 'profile/stats.svg'
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit & Push Changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update GitHub Stats"
          file_pattern: 'profile/*.svg'
