name: GitHub Readme Stats Action

on:
  schedule:
    - cron: '0 0 * * *' # Läuft jede Nacht um 0:00 Uhr
  workflow_dispatch: # Ermöglicht manuelles Starten

permissions:
  contents: write # WICHTIG: Erlaubt der Action, die Bilder in dein Repo zu speichern

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Generate Top Languages Card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: 'username=snabady&layout=compact&theme=visual_studio_code'
          path: 'profile/top-langs.svg'
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate General Stats Card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: 'username=snabady&show_icons=true&theme=visual_studio_code&include_all_commits=true'
          path: 'profile/stats.svg'
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit & Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git diff-index --quiet HEAD || git commit -m "Update GitHub Stats"
          git push
